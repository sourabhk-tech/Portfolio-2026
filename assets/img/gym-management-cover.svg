    <rect x="360" y="370" width="30" height="110" rx="3"/>
    <rect x="420" y="392" width="30" height="88" rx="3"/>
    <rect x="480" y="338" width="30" height="142" rx="3"/>
    <rect x="540" y="356" width="30" height="124" rx="3"/>
    <rect x="600" y="318" width="30" height="162" rx="3"/>
    <rect x="660" y="348" width="30" height="132" rx="3"/>
    <rect x="720" y="372" width="30" height="108" rx="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#666" text-anchor="middle">
    <text x="315" y="498">MON</text><text x="375" y="498">TUE</text><text x="435" y="498">WED</text><text x="495" y="498">THU</text>
    <text x="555" y="498">FRI</text><text x="615" y="498">SAT</text><text x="675" y="498">SUN</text><text x="735" y="498">AVG</text>
  </g>
  <rect x="650" y="272" width="66" height="20" rx="10" fill="#242424"/>
  <text x="683" y="286" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#CFCFCF" text-anchor="middle">THIS WEEK</text>

  <!-- Donut -->
  <rect x="840" y="252" width="270" height="300" rx="10" fill="#151515" stroke="#292929"/>
  <text x="862" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Capacity</text>
  <text x="862" y="300" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6E6E6E">Live occupancy</text>
  <circle cx="975" cy="390" r="66" fill="none" stroke="#242424" stroke-width="16"/>
  <circle cx="975" cy="390" r="66" fill="none" stroke="#FBBA42" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="415" stroke-dashoffset="75" transform="rotate(-90 975 390)"/>
  <text x="975" y="392" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">82%</text>
  <text x="975" y="410" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="1.4" fill="#6E6E6E" text-anchor="middle">OCCUPIED</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9A9A9A">
    <circle cx="870" cy="492" r="3" fill="#FBBA42"/><text x="880" y="495">Members</text>
    <circle cx="948" cy="492" r="3" fill="#6E6E6E"/><text x="958" y="495">Guests</text>
    <circle cx="1024" cy="492" r="3" fill="#3A3A3A"/><text x="1034" y="495">Staff</text>
  </g>

  <!-- Table -->
  <rect x="260" y="572" width="850" height="190" rx="10" fill="#151515" stroke="#292929"/>
  <text x="282" y="602" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Recent check-ins</text>
  <text x="1088" y="602" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#FBBA42" text-anchor="end">View all →</text>
  <line x1="282" y1="616" x2="1088" y2="616" stroke="#262626"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6E6E6E">
    <text x="282" y="636">MEMBER</text><text x="560" y="636">PLAN</text><text x="760" y="636">CHECK-IN</text><text x="980" y="636">STATUS</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#DADADA">
    <text x="282" y="666">Aarav Patil</text><text x="560" y="666">Gold Annual</text><text x="760" y="666">06:42 AM</text>
    <text x="282" y="702">Meera Joshi</text><text x="560" y="702">Silver Monthly</text><text x="760" y="702">07:15 AM</text>
    <text x="282" y="738">Rohan Deshmukh</text><text x="560" y="738">Day Pass</text><text x="760" y="738">08:03 AM</text>
  </g>
  <g>
    <rect x="980" y="654" width="58" height="18" rx="9" fill="#1E3A25"/><text x="1009" y="667" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#7DCB8B" text-anchor="middle">ACTIVE</text>
    <rect x="980" y="690" width="58" height="18" rx="9" fill="#1E3A25"/><text x="1009" y="703" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#7DCB8B" text-anchor="middle">ACTIVE</text>
    <rect x="980" y="726" width="58" height="18" rx="9" fill="#3A2E14"/><text x="1009" y="739" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#FBBA42" text-anchor="middle">GUEST</text>
  </g>
</svg>
